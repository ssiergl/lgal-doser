# Host tests, a short fuzz run, the checks (translations, Python tools, ESLint, cppcheck), the
# end-to-end tests of the web UI (Playwright against the mock) and the firmware of every board
# and module variant with its size and SBOM on each push to main and each pull request.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    # GitHub only offers Ubuntu runners; the job itself runs in Debian.
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install clang
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang libclang-rt-dev
      - uses: actions/checkout@v4
      - name: Host tests (AddressSanitizer, UndefinedBehaviorSanitizer)
        run: SAN=1 HOST_CXX=clang++ sh tests/host/run.sh
      - name: Fuzz parsers (short run)
        run: HOST_CXX=clang++ sh tests/fuzz/run.sh 20000 1
  checks:
    # translations, Python tools, web UI and firmware sources without building anything
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 python3-pytest nodejs npm cppcheck
      - uses: actions/checkout@v4
        with:
          submodules: true  # brand/: the contract test (tests/tools) runs the mock, which serves files from it
      - name: Translations
        run: python3 tests/i18n/check_translations.py
      - name: Python tools (pytest)
        run: python3 -m pytest -q tests/tools
      - name: ESLint (web UI)
        run: |
          npm ci --prefix tests/lint --ignore-scripts --no-audit --no-fund
          tests/lint/node_modules/.bin/eslint -c tests/lint/eslint.config.js components/webui/www
      - name: cppcheck (firmware)
        run: sh tests/lint/cppcheck.sh
  e2e:
    # the web UI in Chromium and WebKit (desktop and phone size) and Firefox against tools/mock/webui_server.py
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      # Firefox does not start when $HOME belongs to another user (in the container it is
      # /github/home); install and run with root's home so both find the same browsers
      HOME: /root
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 nodejs npm
      - uses: actions/checkout@v4
        with:
          submodules: true  # brand/: the mock serves the logo and the shared web design from it
      - name: Install Playwright, Chromium, WebKit and Firefox
        run: |
          npm ci --prefix tests/e2e --ignore-scripts --no-audit --no-fund
          npx --prefix tests/e2e playwright install --with-deps chromium webkit firefox
      - name: End-to-end tests (web UI)
        run: npx --prefix tests/e2e playwright test -c tests/e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/report/
            tests/e2e/results/
          retention-days: 14
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1.1
    strategy:
      matrix:
        board: [d5v1]  # one entry per boards/<id>.cmake
        variant: [N8R8, N16R8, N32R8]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # brand/: the logo and the shared web design
      - name: Build ${{ matrix.board }} ${{ matrix.variant }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B "build-${{ matrix.board }}-${{ matrix.variant }}" -DBOARD=${{ matrix.board }} -DVARIANT=${{ matrix.variant }} build
      - name: Image size ${{ matrix.board }} ${{ matrix.variant }}
        run: python3 tests/size/check_image_size.py "build-${{ matrix.board }}-${{ matrix.variant }}"
      - name: SBOM ${{ matrix.board }} ${{ matrix.variant }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          pip install -q esp-idf-sbom==1.5.0
          python tools/sbom.py "build-${{ matrix.board }}-${{ matrix.variant }}" sbom.spdx.json
