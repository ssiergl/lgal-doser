# Pushing a tag vX.Y.Z (equal to version.txt) builds all boards and module variants and
# publishes them with the update manifest as a GitHub release. Devices with
# the update source
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
# then offer it. Tags with a pre-release part (v1.0.0-rc.1) become
# pre-releases, which "latest" skips. Every release also updates the beta
# channel when it is newer than the channel: the pre-release "channel-beta"
# holds only a manifest.json with the newest version, release candidate or
# release (tools/channel_manifest.py); devices set to the beta channel read
#   https://github.com/<owner>/<repo>/releases/download/channel-beta/manifest.json
# The release text is the CHANGELOG.md section of the version plus every
# commit since the previous tag (tools/release_notes.py).
# The images hold no secret: every device keeps its own in the factory
# partition (tools/provision.py).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # brand/: the logo and the shared web design
      - name: Tag matches version.txt
        run: |
          v="$(tr -d ' \n' < version.txt)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version.txt ($v)"; exit 1; }
      - name: Build all boards and variants
        shell: bash
        env:
          NOTES: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          . "$IDF_PATH/export.sh"
          tools/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install GitHub CLI
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gh ca-certificates python3 git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history for the release notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          python3 tools/release_notes.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
      - name: Update the beta channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          if gh release view channel-beta --repo "$repo" >/dev/null 2>&1; then
            gh release download channel-beta --repo "$repo" --pattern manifest.json --dir current || true
          else
            gh release create channel-beta --repo "$repo" --prerelease --target "$GITHUB_SHA" \
              --title "Beta channel" \
              --notes "Update manifest of the beta channel (newest release candidate or release). Not a release of its own: devices set to the beta channel read manifest.json here."
          fi
          python3 tools/channel_manifest.py dist/manifest.json \
            "https://github.com/$repo/releases/download/$GITHUB_REF_NAME" \
            -o channel/manifest.json --current current/manifest.json
          [ ! -f channel/manifest.json ] || gh release upload channel-beta channel/manifest.json --clobber --repo "$repo"
