<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG Aquatic Life – Setup</title>
<link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/style.css">
<script>
// colour theme as chosen in the web UI (otherwise the system setting)
try{const t=localStorage.getItem('lgal.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<style>
/* Colours, cards, fields, buttons, the reef and the background logo come from the web UI
   (/ui/style.css, public), so the setup looks like the pages behind it. */
body{min-height:100vh;min-height:100dvh}
.mark{--head-h:56px}
@media (max-width:939px){  /* no bottom bar here: the reef sits on the bottom edge */
 .reef,.bubbles{bottom:env(safe-area-inset-bottom)}
 .mark{--reef-top:calc(env(safe-area-inset-bottom) + min(22vh,180px))}
}
/* the step card floats in the middle of the logo (the box between the language picker and the
   reef that style.css gives .mark); title and progress hang above it, the buttons below */
main{--gap-y:clamp(12px,4vh,40px);display:grid;grid-template-rows:1fr auto 1fr;max-width:520px;
 min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(56px + var(--gap-y)) 16px calc(min(30vh,240px) + var(--gap-y))}
@media (max-width:939px){main{padding-bottom:calc(env(safe-area-inset-bottom) + min(22vh,180px) + var(--gap-y))}}
.head{align-self:end;text-align:center}
#stepno{margin:2px 0 0;font-size:13px}
.progress{display:flex;gap:4px;margin:14px 0}.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}.progress i.on{background:var(--acc)}
.nav{align-self:start;display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.nav #next{margin-left:auto}
h2{margin:0 0 10px}
input,select{width:100%}
input[type=radio],input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:10px 0 6px}
label.opt{display:flex;align-items:center;color:var(--text);font-size:15px;font-weight:400;background:var(--card-2);
 border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;cursor:pointer}
[hidden]{display:none!important}
.row{gap:8px;align-items:end;margin-top:10px}.row>*{flex:1 1 150px}.row>button{flex:0 0 auto}
.msg:empty{display:none}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.langs button{display:flex;justify-content:flex-start;width:100%;margin-top:8px;font-size:15px;padding:10px 12px}
.langs button{gap:12px;align-items:center}.langs .flag{flex:none;width:24px;height:24px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.25)}.langs .flag svg{display:block;width:100%;height:100%}
.st{border-left:3px solid var(--line);padding:4px 10px;margin-top:10px;font-size:14px}.st.good{border-color:var(--ok)}
ul{padding-left:20px}
#lang{position:absolute;top:14px;right:16px;z-index:2}
</style>
<script src="/flags.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<div id="lang"></div>
<div class="sea" aria-hidden="true"></div>
<img class="mark" src="/ui/logo.svg" alt="" aria-hidden="true" onerror="this.remove()">
<main>
<div class="head"><h1 data-i18n="title"></h1><p class="mut" id="stepno"></p>
<div class="progress" id="bar"></div></div>
<div class="cards">

<section class="card" data-step="lang">
<h2 data-i18n="lang.title"></h2>
<p class="hint" data-i18n="lang.hint"></p>
<div class="langs" id="langs"></div>
</section>

<section class="card" data-step="pw">
<h2 data-i18n="pw.title"></h2>
<div id="pw_set" hidden><p data-i18n="pw.done"></p></div>
<form id="f_pw"><p class="hint" data-i18n="pw.hint"></p>
<input value="admin" autocomplete="username" hidden>
<label data-i18n="pw.device"></label><input id="pw0" maxlength="31" autocomplete="off" autocapitalize="off" spellcheck="false">
<label data-i18n="pw.new"></label><input id="pw1" type="password" autocomplete="new-password" minlength="8" maxlength="64">
<label data-i18n="pw.repeat"></label><input id="pw2" type="password" autocomplete="new-password" maxlength="64">
<div class="row"><span></span><button data-i18n="pw.save"></button></div>
<p class="hint" data-i18n="pw.then"></p></form>
<div class="msg" id="pw_msg"></div>
</section>

<section class="card" data-step="net">
<h2 data-i18n="net.title"></h2>
<label class="opt"><input type="radio" name="via" value="lan" checked><span data-i18n="net.lan"></span></label>
<label class="opt"><input type="radio" name="via" value="wlan"><span data-i18n="net.wlan"></span></label>
<div id="wbox" hidden>
<div class="row"><div><label data-i18n="net.ssid"></label><input id="ssid" maxlength="32" autocomplete="off"></div><button type="button" class="sec" id="scan" data-i18n="net.scan"></button></div>
<div class="nets" id="nets"></div><div class="msg" id="scan_msg"></div>
<label data-i18n="net.password"></label><input id="wpw" type="password" maxlength="63" autocomplete="new-password">
<div class="row"><span></span><button type="button" id="wtest" data-i18n="net.connect"></button></div>
</div>
<div class="st" id="netst"></div>
<div class="msg" id="net_msg"></div>
<p class="hint" data-i18n="net.more"></p>
</section>

<section class="card" data-step="time">
<h2 data-i18n="time.title"></h2>
<label data-i18n="time.zone"></label><select id="tz"></select>
<div id="tzc_box" hidden><label data-i18n="time.posix"></label><input id="tzc" maxlength="63" autocomplete="off" placeholder="CET-1CEST,M3.5.0,M10.5.0/3"></div>
<label data-i18n="time.ntp"></label><input id="ntp" maxlength="63" autocomplete="off" placeholder="pool.ntp.org">
<p class="hint" data-i18n="time.ntp.hint"></p>
<div class="st" id="timest"></div>
<label class="opt" id="usebr_box" hidden><input type="checkbox" id="usebr"><span data-i18n="time.browser"></span></label>
<div class="msg" id="time_msg"></div>
</section>

<section class="card" data-step="done">
<h2 data-i18n="done.title"></h2>
<div id="done_todo"><p data-i18n="done.hint"></p><ul id="urls"></ul></div>
<div id="done_ok" hidden><p class="ok" data-i18n="done.ok"></p><ul id="urls2"></ul><p id="done_ap" data-i18n="done.ap"></p></div>
<div class="msg" id="done_msg"></div>
</section>
</div>

<div class="nav"><button type="button" class="sec" id="back" data-i18n="back"></button><button type="button" id="next" data-i18n="next"></button></div>
</main>
<script type="module">
import { drawReef } from '/ui/lib/reef.js';
drawReef(document.querySelector('.sea'));
</script>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const STEPS=['lang','pw','net','time','done'];
let step=0,S=null,NS=null,T=null,timer=null,done=false,signedIn=false;
async function api(method,path,body){
  const o={method,cache:'no-store'};if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  const r=await fetch(path,o);let j={};try{j=await r.json()}catch(e){}
  if(r.status===401){location.href='/login?next=/setup';throw new Error('login')}
  if(!r.ok){const e=new Error(i18n.error(j,r.status));e.body=j;throw e}return j;
}
function msg(id,txt,cls){const m=$(id);m.className='msg '+(cls||'err');m.textContent=txt}
function urls(id,list){$(id).innerHTML=(list||[]).map(u=>`<li><a href="${esc(u)}">${esc(u)}</a></li>`).join('')}

function show(n){
  step=Math.max(0,Math.min(STEPS.length-1,n));
  document.querySelectorAll('[data-step]').forEach(s=>s.hidden=s.dataset.step!==STEPS[step]);
  $('stepno').textContent=t('step',{n:step+1,m:STEPS.length});
  $('bar').innerHTML=STEPS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');
  $('back').hidden=step===0||done;
  clearInterval(timer);timer=null;
  const k=STEPS[step];
  if(k==='pw')showPw();
  if(k==='net'){netStatus();timer=setInterval(netStatus,2000)}
  if(k==='time')loadTime();
  if(k==='done')loadDone();
  updNext();
}
function updNext(){
  const k=STEPS[step];
  $('next').textContent=t(k==='done'?'done.btn':'next');
  $('next').hidden=done;
  $('next').disabled=(k==='pw'&&!S.password_set)||(k==='net'&&!(NS&&NS.active!=='none'));
}

// 1 language
function buildLangs(){
  $('langs').innerHTML=i18n.languages.map(l=>`<button type="button" class="${l===i18n.lang?'':'sec'}" data-l="${l}" lang="${l}">${i18n.flag(l)}<span>${esc(i18n.name(l))}</span></button>`).join('');
  // before the sign-in the choice stays in the browser; step 2 stores it on the device
  $('langs').querySelectorAll('button').forEach(b=>b.onclick=()=>{i18n.setLang(b.dataset.l,signedIn);show(1)});
}
// 2 password
function showPw(){$('pw_set').hidden=!S.password_set;$('f_pw').hidden=S.password_set;if(!S.password_set)$('pw0').focus()}
// First admin password with the device password from the label; then sign in once with it
$('f_pw').onsubmit=async e=>{e.preventDefault();
  if($('pw1').value!==$('pw2').value){msg('pw_msg',t('pw.mismatch'));return}
  try{await api('POST','/api/v1/auth/claim',{device_password:$('pw0').value.trim(),new:$('pw1').value,language:i18n.lang});
    ['pw0','pw1','pw2'].forEach(i=>$(i).value='');location.href='/login?next=/setup&first=1'}
  catch(err){const c=err.body&&err.body.error&&err.body.error.code;if(c==='password_already_set')location.reload();else msg('pw_msg',err.message)}};
// 3 network
const via=()=>document.querySelector('[name=via]:checked').value;
document.querySelectorAll('[name=via]').forEach(r=>r.onchange=()=>{$('wbox').hidden=via()!=='wlan';netStatus()});
async function netStatus(){
  try{NS=await api('GET','/api/v1/net/status')}catch(e){return}
  const L=NS.lan,W=NS.wlan;let txt,good=false;
  if(W.state==='connected'&&W.ip){txt=t('net.wlan.ok',{s:esc(W.ssid),ip:W.ip});good=true}
  if(L.ip){txt=t('net.lan.ok',{ip:L.ip})+(txt?'<br>'+txt:'');good=true}
  if(!txt)txt=via()==='lan'?(!L.present?t('net.lan.missing'):!L.link?t('net.lan.nolink'):t('net.lan.noip')):t('net.none');
  $('netst').innerHTML=txt;$('netst').className='st'+(good?' good':'');
  updNext();
}
$('scan').onclick=async()=>{
  $('scan').disabled=true;msg('scan_msg',t('net.scan.run'),'mut');$('nets').innerHTML='';
  try{await api('POST','/api/v1/net/scan').catch(e=>{if(!(e.body&&e.body.error&&e.body.error.code==='busy'))throw e});
    let r;for(let i=0;i<40;i++){await sleep(750);r=await api('GET','/api/v1/net/scan');if(r.state!=='running')break}
    $('scan_msg').textContent=r.networks&&r.networks.length?'':t('net.scan.none');
    $('nets').innerHTML=(r.networks||[]).map((n,i)=>`<button type="button" data-i="${i}"><span>${n.secure?'🔒 ':''}${esc(n.ssid)}</span><span class="mut">${n.rssi} dBm</span></button>`).join('');
    $('nets').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('ssid').value=r.networks[b.dataset.i].ssid;$('nets').innerHTML='';$('wpw').focus()});
  }catch(e){msg('scan_msg',e.message)}finally{$('scan').disabled=false}
};
$('wtest').onclick=async()=>{
  const ssid=$('ssid').value,pw=$('wpw').value;$('wtest').disabled=true;msg('net_msg',t('net.testing',{s:ssid}),'mut');
  try{await api('POST','/api/v1/net/wlan/test',{ssid,password:pw,dhcp:true});
    let r;for(let i=0;i<60;i++){await sleep(1000);r=await api('GET','/api/v1/net/wlan/test');if(r.state!=='running')break}
    if(r.state!=='ok'){msg('net_msg',t('net.fail',{r:t('r.'+(r.reason||'timeout'))}));return}
    // LAN stays preferred; Wi-Fi takes over without cable
    await api('PUT','/api/v1/net/settings',{mode:'auto',wlan:{ssid,password:pw,dhcp:true}});
    msg('net_msg',t('net.saved'),'ok');
  }catch(e){msg('net_msg',e.message)}finally{$('wtest').disabled=false;netStatus()}
};
// 4 time
function buildZones(){
  $('tz').innerHTML=ZONES.map((z,i)=>`<option value="${i}">${esc(z[0])}</option>`).join('')+`<option value="c">${t('time.custom')}</option>`;
}
$('tz').onchange=()=>{$('tzc_box').hidden=$('tz').value!=='c'};
async function loadTime(){
  try{T=await api('GET','/api/v1/system/time')}catch(e){msg('time_msg',e.message);return}
  let i=ZONES.findIndex(z=>z[1]===T.timezone);
  if(!S.completed){  // first setup: suggest the browser's zone
    const b=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';const k=ZONES.findIndex(z=>z[2].includes(b));if(k>=0)i=k}
  $('tz').value=i>=0?String(i):'c';$('tzc').value=i>=0?'':T.timezone;$('tzc_box').hidden=i>=0;
  $('ntp').value=T.ntp_server;
  $('timest').innerHTML=T.valid?t('time.now',{t:esc(T.local)}):`<span class="warn">${t('time.none')}</span>`;
  const off=Math.abs(T.utc-Date.now()/1000);
  $('usebr_box').hidden=T.valid&&off<120;$('usebr').checked=!T.valid||off>=120;
}
async function saveTime(){
  const b={timezone:$('tz').value==='c'?$('tzc').value.trim():ZONES[+$('tz').value][1],ntp_server:$('ntp').value.trim()};
  if(!$('usebr_box').hidden&&$('usebr').checked)b.utc=Math.floor(Date.now()/1000);
  await api('PUT','/api/v1/system/time',b);
}
// 5 finish
async function loadDone(){
  try{const j=await api('GET','/api/v1/setup');S.completed=j.completed;urls('urls',j.urls);
    if(j.completed&&!done)msg('done_msg',t('done.again'),'mut');}catch(e){msg('done_msg',e.message)}
}
async function complete(){
  try{const j=await api('POST','/api/v1/setup/complete');done=true;S.completed=true;
    urls('urls2',j.urls);$('done_todo').hidden=true;$('done_ok').hidden=false;
    $('done_ap').textContent=t('done.ap',{s:j.ap_off_in_s});$('done_msg').textContent='';updNext();$('back').hidden=true;
  }catch(e){msg('done_msg',e.message)}
}

$('back').onclick=()=>show(step-1);
$('next').onclick=async()=>{
  const k=STEPS[step];
  if(k==='time'){try{await saveTime()}catch(e){const f=e.body&&e.body.error&&e.body.error.field;msg('time_msg',f?e.message+' – '+t(f==='ntp_server'?'time.ntp':f==='utc'?'time.browser':'time.zone'):e.message);return}}
  if(k==='done'){complete();return}
  show(step+1);
};
function build(){buildLangs();buildZones();i18n.apply();if(S)show(step)}
i18n.onChange(build);
// Steps 1 and 2 work without sign-in. Once an admin password exists the wizard needs a
// session; after the first sign-in it goes on with the network.
i18n.init('lang').then(async()=>{
  let A;try{A=await api('GET','/api/v1/auth/status')}catch(e){return}
  signedIn=A.logged_in&&A.via==='session';
  if(A.password_set&&!signedIn){location.replace('/login?next=/setup');return}
  if(signedIn){try{S=await api('GET','/api/v1/setup')}catch(e){return}}
  else S={password_set:false,completed:A.setup_completed};
  build();show(signedIn&&!S.completed?2:0);
});
</script>
</body>
</html>
