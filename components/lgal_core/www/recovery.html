<script>
// colour theme as chosen in the web UI (otherwise the system setting)
try{const t=localStorage.getItem('lgal.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<style>
/* Colours, cards, buttons and fields come from the shared design (/ui/lgal.css). This page stays
   plain on purpose: no logo, no reef, no transparency, no animation, no web UI scripts. Without
   the stylesheet it still works with the browser's own styles. */
main{max-width:760px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 var(--gap)}
.card{background:var(--card);backdrop-filter:none;margin-bottom:var(--gap)}
.card h2{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td:first-child{color:var(--mut);width:42%;padding-right:12px}
.links a{color:var(--text)}
.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload input{flex:1 1 220px}
progress{width:100%;height:8px;margin-top:12px;accent-color:var(--acc)}
.msg{margin-top:10px;font-size:14px}.msg:empty{display:none}
.err{color:var(--err)}.ok{color:var(--ok)}
pre.log{margin:12px 0 0;max-height:360px;overflow:auto;padding:10px;border-radius:10px;background:var(--card-2);
 font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<script src="/flags.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<main>
<header class="head">
<h1 data-i18n="title"></h1>
<div id="lang"></div>
</header>

<section class="card" id="links-card" hidden>
<h2 data-i18n="sec.links"></h2>
<ul class="links" id="links"></ul>
</section>

<section class="card">
<h2 data-i18n="sec.device"></h2>
<table id="info"></table>
</section>

<section class="card">
<h2 data-i18n="sec.update"></h2>
<div class="upload"><input type="file" id="fw" accept=".bin"><button id="up" data-i18n="btn.upload"></button></div>
<progress id="prog" max="100" value="0" hidden></progress>
<div class="msg" id="upmsg"></div>
</section>

<section class="card">
<h2 data-i18n="sec.diag"></h2>
<div class="row">
<button class="sec" id="logbtn" data-i18n="btn.log"></button>
<a class="btn sec" href="/api/v1/system/coredump" id="cdlink" data-i18n="btn.coredump" hidden></a>
<button class="sec" id="reboot" data-i18n="btn.reboot"></button>
</div>
<pre class="log" id="log" hidden></pre>
</section>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function row(k,v){return `<tr><td>${t(k)}</td><td>${v}</td></tr>`}
let info=null;
function render(){
  if(!info){$('info').innerHTML=`<tr><td>${t('loading')}</td><td></td></tr>`;return}
  if(info.err){$('info').innerHTML=row('error',esc(info.err));return}
  const j=info,f=j.firmware,s=j.system,n=j.network,d=j.device,tm=j.time;
  $('info').innerHTML=
    row('i.firmware',`${esc(f.version)} (${f.partition}, ${f.ota_state})`)+
    row('i.build',`${esc(f.built)} · IDF ${esc(f.idf)}`)+
    (f.last_invalid_partition?row('i.rolledback',`<span class="err">${t('i.rolledback.v',{p:f.last_invalid_partition})}</span>`):'')+
    row('i.hostname',`${esc(d.hostname)}.local`)+row('i.mac',d.mac)+
    row('i.eth',n.eth_present?(n.eth_link?(n.eth_ip||t('i.eth.noip')):t('i.eth.nolink')):`<span class="err">${t('i.eth.missing')}</span>`)+
    (n.wlan&&n.wlan!=='off'?row('i.wlan',n.wlan_ip||t('i.wlan.'+n.wlan)):'')+
    row('i.ap',n.ap_active?t('i.ap.on',{n:n.ap_clients}):t('i.ap.off'))+
    row('i.time',tm&&tm.valid?t('i.time.v',{t:esc(tm.local),s:t('src.'+tm.source)}):`<span class="err">${t('i.time.none')}</span>`)+
    row('i.uptime',t('i.uptime.v',{h:Math.floor(s.uptime_s/3600),m:Math.floor(s.uptime_s%3600/60)}))+
    row('i.reset',s.reset_reason)+
    row('i.heap',`${(s.heap_free/1024).toFixed(0)} / ${(s.heap_min_free/1024).toFixed(0)} KiB`)+
    row('i.psram',`${(s.psram_free/1048576).toFixed(1)} MiB`)+
    row('i.coredump',s.coredump?`<span class="err">${t('i.coredump.yes')}</span>`:t('i.coredump.no'));
  $('cdlink').hidden=!s.coredump;
  // Translate link names via the id, otherwise show the firmware's English name
  $('links').innerHTML=(j.links||[]).map(l=>{const k='link.'+l.id,x=t(k);return `<li><a href="${esc(l.path)}">${esc(x===k?l.name:x)}</a></li>`}).join('');
  $('links-card').hidden=!(j.links||[]).length;
}
async function loadInfo(){
  try{const r=await fetch('/api/v1/system/info',{cache:'no-store'});info=await r.json()}
  catch(e){info={err:String(e)}}
  render();
}
$('up').onclick=()=>{
  const file=$('fw').files[0],msg=$('upmsg');
  if(!file){msg.className='msg err';msg.textContent=t('up.nofile');return}
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/v1/ota/firmware');
  xhr.setRequestHeader('Content-Type','application/octet-stream');
  $('prog').hidden=false;$('up').disabled=true;msg.className='msg';msg.textContent=t('up.sending');
  xhr.upload.onprogress=e=>{if(e.lengthComputable)$('prog').value=e.loaded/e.total*100};
  xhr.onload=()=>{
    let j={};try{j=JSON.parse(xhr.responseText)}catch(e){}
    if(xhr.status===200){msg.className='msg ok';msg.textContent=t('up.ok');setTimeout(()=>location.reload(),20000)}
    else{msg.className='msg err';msg.textContent=t('up.fail',{status:xhr.status,msg:i18n.error(j,xhr.status)});$('up').disabled=false}
  };
  xhr.onerror=()=>{msg.className='msg err';msg.textContent=t('up.conn');$('up').disabled=false};
  xhr.send(file);
};
$('logbtn').onclick=async()=>{const r=await fetch('/api/v1/system/log',{cache:'no-store'});const p=$('log');p.textContent=await r.text();p.hidden=false;p.scrollTop=p.scrollHeight};
$('reboot').onclick=async()=>{if(!confirm(t('reboot.confirm')))return;await fetch('/api/v1/system/reboot',{method:'POST'});$('upmsg').textContent=t('reboot.busy');setTimeout(()=>location.reload(),15000)};
i18n.onChange(render);
i18n.init('lang');
loadInfo();setInterval(loadInfo,10000);
</script>
