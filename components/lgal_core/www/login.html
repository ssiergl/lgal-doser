<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG Aquatic Life – Login</title>
<link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/lgal.css">
<script>
// colour theme as chosen in the web UI (otherwise the system setting)
try{const t=localStorage.getItem('lgal.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
</script>
<style>
/* Colours, cards, fields, buttons, the reef and the background logo come from the web UI
   (/ui/lgal.css, public: the shared design from the brand repository), so the sign-in looks like the pages behind it. */
body{min-height:100vh;min-height:100dvh}
.mark{--head-h:56px}
@media (max-width:939px){  /* no bottom bar here: the reef sits on the bottom edge */
 .reef,.bubbles{bottom:env(safe-area-inset-bottom)}
 .mark{--reef-top:calc(env(safe-area-inset-bottom) + min(22vh,180px))}
}
/* the form floats in the middle of the logo: the same box between the language picker and the
   reef that lgal.css gives the logo (.mark) */
main{--gap-y:clamp(12px,4vh,40px);display:flex;flex-direction:column;justify-content:center;max-width:420px;
 min-height:100vh;min-height:100dvh;margin:0 auto;padding:calc(56px + var(--gap-y)) 16px calc(min(30vh,240px) + var(--gap-y))}
@media (max-width:939px){main{padding-bottom:calc(env(safe-area-inset-bottom) + min(22vh,180px) + var(--gap-y))}}
/* only the cards are centred: the title hangs above them, otherwise it all looks a little too low */
.box{position:relative;margin-bottom:-14px}  /* without the gap under the last card */
.head{position:absolute;left:0;right:0;bottom:100%;margin-bottom:16px;text-align:center}
.head .dev{color:var(--mut);font-size:13px;margin-top:2px;min-height:1.3em}
.card{margin-bottom:14px}
h2{margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:10px 0 6px}
input{width:100%}
input[readonly]{color:var(--mut);background:transparent}
[hidden]{display:none!important}
.row{justify-content:flex-end;margin-top:14px}
.msg:empty{display:none}
.hint{font-size:13px;color:var(--mut);margin:0 0 6px}
#lang{position:absolute;top:14px;right:16px;z-index:2}
</style>
<script src="/flags.js"></script>
<script src="/i18n.js"></script>
</head>
<body>
<div id="lang"></div>
<div class="sea" aria-hidden="true"></div>
<img class="mark" src="/ui/logo.svg" alt="" aria-hidden="true" onerror="this.remove()">
<main>
<div class="box">
<div class="head"><h1 data-i18n="title"></h1><div class="dev" id="dev"></div></div>

<section class="card" id="c_login" hidden>
<p class="hint" id="l_hint"></p>
<form id="f_login"><label data-i18n="user"></label><input value="admin" readonly tabindex="-1" autocomplete="username">
<label data-i18n="pw"></label><input id="l_pw" type="password" autocomplete="current-password" required>
<div class="row"><button data-i18n="login.btn"></button></div></form>
<div class="msg" id="l_msg"></div>
</section>

<section class="card" id="c_recover" hidden>
<h2 data-i18n="rec.title"></h2>
<p class="hint" data-i18n="rec.hint"></p>
<form id="f_rec"><input value="admin" autocomplete="username" hidden>
<label data-i18n="rec.device"></label><input id="r_dev" autocomplete="off" required>
<label data-i18n="pw.new"></label><input id="r_pw" type="password" autocomplete="new-password" required>
<label data-i18n="pw.repeat"></label><input id="r_pw2" type="password" autocomplete="new-password" required>
<div class="row"><button data-i18n="rec.btn"></button></div></form>
<div class="msg" id="r_msg"></div>
</section>
</div>
</main>
<script type="module">
import { drawReef } from '/ui/lib/reef.js';
drawReef(document.querySelector('.sea'));
</script>

// Sign-in only: password, API keys and the engineering unlock live in the web interface.
// Without an admin password there is nothing to sign in with: the setup wizard sets it first.
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
// only local paths as target (no open redirect)
const next=(n=>{try{const u=new URL(n,location.origin);if(n.startsWith('/')&&u.origin===location.origin&&!u.pathname.startsWith('/login'))return u.pathname+u.search+u.hash}catch(e){}return'/'})(P.get('next')||'/');
let S=null;
async function api(method,path,body){
  const o={method,cache:'no-store'};if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  const r=await fetch(path,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(i18n.error(j,r.status));e.body=j;throw e}return j;
}
function msg(id,txt,ok){const m=$(id);m.className='msg '+(ok?'ok':'err');m.textContent=txt}
function errMsg(id,e){const j=e.body&&e.body.error;msg(id,j&&j.retry_after_s?t('login.wait',{s:j.retry_after_s}):e.message)}
function same(a,b,id){if($(a).value!==$(b).value){msg(id,t('pw.mismatch'));return false}return true}
const go=()=>location.replace(next);

async function load(){
  S=await api('GET','/api/v1/auth/status');
  if(!S.password_set)return location.replace('/setup');
  if(S.logged_in&&S.via==='session')return go();
  $('dev').textContent=S.device||'';
  $('c_login').hidden=false;$('c_recover').hidden=!S.recovery;
  $('l_hint').textContent=t('login.first');$('l_hint').hidden=P.get('first')!=='1';
  $('l_pw').focus();
}
$('f_login').onsubmit=e=>{e.preventDefault();api('POST','/api/v1/auth/login',{password:$('l_pw').value}).then(()=>{$('l_pw').value='';load()}).catch(e=>errMsg('l_msg',e))};
$('f_rec').onsubmit=e=>{e.preventDefault();if(!same('r_pw','r_pw2','r_msg'))return;
  api('POST','/api/v1/auth/recover',{device_password:$('r_dev').value.trim(),new:$('r_pw').value}).then(load).catch(e=>errMsg('r_msg',e))};
i18n.onChange(()=>{if(S)load()});
i18n.init('lang').then(load);
</script>
