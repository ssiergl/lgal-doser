<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG Aquatic Life – Login</title>
<link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0d1b24;--card:#132836;--fg:#e6f1f5;--mut:#8fb0bf;--acc:#2bb5c9;--err:#e5534b;--ok:#3fb950;--warn:#d29922}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);
 background:radial-gradient(circle at 50% 150px,#173a52 0,#11283a 170px,var(--bg) 420px) no-repeat,var(--bg)}
main{position:relative;max-width:420px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin:34px 0 22px}
.hero .logo{display:block;width:min(220px,56vw);height:auto;aspect-ratio:1;margin-bottom:18px;filter:drop-shadow(0 12px 36px rgba(0,0,0,.45))}
.hero .dev{color:var(--mut);font-size:13px;margin-top:2px;min-height:1.3em}
#lang{position:absolute;top:14px;right:16px}
.card{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
button,input,select{font:inherit}button{background:var(--acc);color:#04222a;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;font-weight:600}
input{background:#0a161e;color:var(--fg);border:1px solid #2c4757;border-radius:6px;padding:8px 10px;width:100%}
input[readonly]{color:var(--mut);background:transparent}
select{background:#0a161e;color:var(--fg);border:1px solid #2c4757;border-radius:6px;padding:5px 7px}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
[hidden]{display:none!important}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.msg{min-height:1.3em;font-size:13px;margin-top:8px}.err{color:var(--err)}.ok{color:var(--ok)}
.hint{font-size:13px;color:var(--mut);margin:0 0 6px}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<main>
<select id="lang" data-i18n-title="lang.label"></select>
<div class="hero"><img class="logo" src="/ui/logo.svg" alt="LG Aquatic Life" width="220" height="220" onerror="this.remove()">
<h1 data-i18n="title"></h1><div class="dev" id="dev"></div></div>

<section class="card" id="c_login" hidden>
<p class="hint" id="l_hint"></p>
<form id="f_login"><label data-i18n="user"></label><input value="admin" readonly tabindex="-1" autocomplete="username">
<label data-i18n="pw"></label><input id="l_pw" type="password" autocomplete="current-password" required>
<div class="row"><button data-i18n="login.btn"></button></div></form>
<div class="msg" id="l_msg"></div>
</section>

<section class="card" id="c_recover" hidden>
<h2 data-i18n="rec.title"></h2>
<p class="hint" data-i18n="rec.hint"></p>
<form id="f_rec"><input value="admin" autocomplete="username" hidden>
<label data-i18n="rec.device"></label><input id="r_dev" autocomplete="off" required>
<label data-i18n="pw.new"></label><input id="r_pw" type="password" autocomplete="new-password" required>
<label data-i18n="pw.repeat"></label><input id="r_pw2" type="password" autocomplete="new-password" required>
<div class="row"><button data-i18n="rec.btn"></button></div></form>
<div class="msg" id="r_msg"></div>
</section>

<section class="card" id="c_setpw" hidden>
<h2 data-i18n="pw.title"></h2>
<p class="hint" data-i18n="pw.hint"></p>
<form id="f_pw"><input value="admin" autocomplete="username" hidden>
<label data-i18n="pw.new"></label><input id="p_pw" type="password" autocomplete="new-password" required>
<label data-i18n="pw.repeat"></label><input id="p_pw2" type="password" autocomplete="new-password" required>
<div class="row"><button data-i18n="btn.save"></button></div></form>
<div class="msg" id="p_msg"></div>
</section>
</main>
<script>
i18n.add({
en:{
 'page.title':'LG Aquatic Life – Sign in','title':'Sign in','user':'User','pw':'Password','login.btn':'Sign in',
 'login.first':'First sign-in: use the device password from the label on the device.',
 'login.wait':'Too many attempts – please wait {s} s.',
 'rec.title':'Forgot password','rec.hint':'You are connected through the setup Wi-Fi. With the device password from the label you can set a new admin password. Schedules and calibration are kept.',
 'rec.device':'Device password (label)','rec.btn':'Set new password',
 'pw.title':'Choose your admin password','pw.hint':'You signed in with the device password. Please choose your own password (at least 8 characters).',
 'pw.new':'New password','pw.repeat':'Repeat new password','pw.mismatch':'The passwords do not match.','btn.save':'Save',
 'err.wrong_password':'Wrong password','err.too_many_attempts':'Too many attempts – please wait',
 'err.password_too_short':'At least 8 characters','err.password_too_long':'At most 64 characters',
 'err.recovery_unavailable':'Only possible through the setup Wi-Fi (hold the button for 3 s)','err.unauthorized':'Please sign in'},
de:{
 'page.title':'LG Aquatic Life – Anmeldung','title':'Anmelden','user':'Benutzer','pw':'Passwort','login.btn':'Anmelden',
 'login.first':'Erste Anmeldung: Geräte-Passwort vom Typenschild verwenden.',
 'login.wait':'Zu viele Versuche – bitte {s} s warten.',
 'rec.title':'Passwort vergessen','rec.hint':'Du bist über das Setup-WLAN verbunden. Mit dem Geräte-Passwort vom Typenschild kannst du ein neues Admin-Passwort setzen. Zeitpläne und Kalibrierung bleiben erhalten.',
 'rec.device':'Geräte-Passwort (Typenschild)','rec.btn':'Neues Passwort setzen',
 'pw.title':'Eigenes Admin-Passwort festlegen','pw.hint':'Du bist mit dem Geräte-Passwort angemeldet. Bitte wähle ein eigenes Passwort (mindestens 8 Zeichen).',
 'pw.new':'Neues Passwort','pw.repeat':'Neues Passwort wiederholen','pw.mismatch':'Die Passwörter stimmen nicht überein.','btn.save':'Speichern',
 'err.wrong_password':'Falsches Passwort','err.too_many_attempts':'Zu viele Versuche – bitte warten',
 'err.password_too_short':'Mindestens 8 Zeichen','err.password_too_long':'Höchstens 64 Zeichen',
 'err.recovery_unavailable':'Nur über das Setup-WLAN möglich (Taster 3 s halten)','err.unauthorized':'Bitte anmelden'}
});
// Sign-in only: password, API keys and the engineering unlock live in the web interface
const $=id=>document.getElementById(id);
const P=new URLSearchParams(location.search);
// only local paths as target (no open redirect)
const next=(n=>{try{const u=new URL(n,location.origin);if(n.startsWith('/')&&u.origin===location.origin&&!u.pathname.startsWith('/login'))return u.pathname+u.search+u.hash}catch(e){}return'/'})(P.get('next')||'/');
let S=null;
async function api(method,path,body){
  const o={method,cache:'no-store'};if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  const r=await fetch(path,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(i18n.error(j,r.status));e.body=j;throw e}return j;
}
function msg(id,txt,ok){const m=$(id);m.className='msg '+(ok?'ok':'err');m.textContent=txt}
function errMsg(id,e){const j=e.body&&e.body.error;msg(id,j&&j.retry_after_s?t('login.wait',{s:j.retry_after_s}):e.message)}
function same(a,b,id){if($(a).value!==$(b).value){msg(id,t('pw.mismatch'));return false}return true}
const go=()=>location.replace(next);

async function load(){
  S=await api('GET','/api/v1/auth/status');
  const li=S.logged_in&&S.via==='session';
  // the setup wizard asks for the admin password itself
  if(li&&(S.password_set||next.startsWith('/setup')))return go();
  $('dev').textContent=S.device||'';
  $('c_login').hidden=li;$('c_recover').hidden=li||!S.recovery;$('c_setpw').hidden=!li;
  $('l_hint').textContent=S.password_set?'':t('login.first');$('l_hint').hidden=S.password_set;
  if(!li)$('l_pw').focus();
}
$('f_login').onsubmit=e=>{e.preventDefault();api('POST','/api/v1/auth/login',{password:$('l_pw').value}).then(()=>{$('l_pw').value='';load()}).catch(e=>errMsg('l_msg',e))};
$('f_rec').onsubmit=e=>{e.preventDefault();if(!same('r_pw','r_pw2','r_msg'))return;
  api('POST','/api/v1/auth/recover',{device_password:$('r_dev').value.trim(),new:$('r_pw').value}).then(load).catch(e=>errMsg('r_msg',e))};
$('f_pw').onsubmit=e=>{e.preventDefault();if(!same('p_pw','p_pw2','p_msg'))return;
  api('POST','/api/v1/auth/password',{current:'',new:$('p_pw').value}).then(load).catch(e=>errMsg('p_msg',e))};
i18n.onChange(()=>{if(S)load()});
i18n.init('lang').then(load);
</script>
</body>
</html>
