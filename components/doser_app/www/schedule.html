<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG Aquatic Life – Schedule test</title>
<style>
:root{--bg:#0d1b24;--card:#132836;--fg:#e6f1f5;--mut:#8fb0bf;--acc:#2bb5c9;--err:#e5534b;--ok:#3fb950;--warn:#d29922;--svc:#a371f7}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 6px}h2{font-size:16px;margin:0 0 10px}h3{font-size:15px;margin:0}
.card{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
table{width:100%;border-collapse:collapse}td{padding:2px 6px 2px 0;vertical-align:top}td.k{color:var(--mut);width:42%}
button,input,select{font:inherit}button{background:var(--acc);color:#04222a;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--mut)}button.stop{background:var(--err);color:#fff}
button.x{background:transparent;color:var(--err);border:1px solid var(--err);padding:4px 9px}
button:disabled{opacity:.5;cursor:default}
input,select{background:#0a161e;color:var(--fg);border:1px solid #2c4757;border-radius:6px;padding:5px 7px;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:6px}.row>*{flex:1 1 80px}.row>button{flex:0 0 auto}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;margin:0 4px 4px 0;background:#1d3a4b}
.chip.ok{background:#173d25;color:#7ee19a}.chip.err{background:#4a1d1d;color:#ff9b95}.chip.warn{background:#463614;color:#f2cc60}.chip.svc{background:#33204f;color:#d2b8ff}
.err{color:var(--err)}.ok{color:var(--ok)}.mut{color:var(--mut)}
.msg{min-height:1.3em;font-size:13px;margin-top:6px;white-space:pre-line}
textarea{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;background:#0a161e;color:var(--fg);border:1px solid #2c4757;border-radius:6px;padding:8px}
.slots{font-size:13px;color:var(--mut);margin-top:8px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
select.lang{width:auto}
</style>
<script src="/i18n.js"></script>
</head>
<body>
<main>
<div class="top">
<h1><span data-i18n="title"></span> <span class="mut" style="font-size:14px" data-i18n="subtitle"></span></h1>
<div class="row" style="align-items:center;margin-top:0">
<span id="clock" class="chip">…</span>
<span style="flex:1"></span>
<a href="/dosing"><button class="sec" data-i18n="btn.dosing"></button></a>
<a href="/"><button class="sec" data-i18n="btn.maint"></button></a>
<select id="lang" class="lang" data-i18n-title="lang.label"></select>
</div>
</div>

<div class="grid" id="pumps"></div>

<section class="card">
<div class="row" style="align-items:center;margin:0 0 6px">
<h2 style="flex:1;margin:0" data-i18n="ed.title"></h2>
<div style="flex:0 0 140px"><select id="ed_pump"></select></div>
</div>
<p class="mut" style="font-size:13px;margin:0 0 6px" data-i18n="ed.hint"></p>
<textarea id="ed_json" rows="14" spellcheck="false"></textarea>
<div class="row"><span></span><button class="sec" id="ed_reload" data-i18n="btn.reload"></button><button id="ed_save" data-i18n="btn.save"></button></div>
<div class="msg" id="ed_msg"></div>
<div class="slots" id="ed_slots"></div>
</section>

<section class="card">
<h2 data-i18n="lk.title"></h2>
<p class="mut" style="font-size:13px;margin:0 0 6px" data-i18n="lk.hint"></p>
<div class="row"><div><label data-i18n="lk.manual"></label><select id="lk_manual"><option value="reject" data-i18n="lk.reject"></option><option value="queue" data-i18n="lk.queue"></option></select></div></div>
<div id="lk_rules"></div>
<div class="row"><button class="sec" id="lk_add" data-i18n="lk.add"></button><span></span><button id="lk_save" data-i18n="btn.save"></button></div>
<div class="msg" id="lk_msg"></div>
</section>

<section class="card">
<h2 data-i18n="eng.title"></h2>
<p class="mut" style="font-size:13px;margin:0 0 6px" data-i18n="eng.hint"></p>
<div class="row">
<div><label data-i18n="eng.grid"></label><input id="e_grid" type="number" min="1" max="60"></div>
<div><label data-i18n="eng.delay"></label><input id="e_delay" type="number" min="1" max="720"></div>
<button class="sec" id="e_save" data-i18n="btn.save"></button>
</div>
<div class="msg" id="emsg"></div>
</section>
<p class="mut" style="font-size:12px" data-i18n="footnote"></p>
</main>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const L=k=>`data-i18n="${k}"`;
const f=(v,d)=>Number(v).toLocaleString(i18n.lang,{minimumFractionDigits:d,maximumFractionDigits:d});
let S=null,E=null,ED=null,LK=null,built=false;

class ApiError extends Error{constructor(m,j){super(m);this.body=j}}
async function api(method,path,body){
  const o={method,cache:'no-store'};
  if(body!==undefined){o.body=JSON.stringify(body);o.headers={'Content-Type':'application/json'}}
  const r=await fetch(path,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new ApiError(i18n.error(j,r.status),j);return j;
}
function msg(id,txt,ok){const m=$(id);m.className='msg '+(ok?'ok':'err');m.textContent=txt}
function chip(txt,c){return `<span class="chip ${c||''}">${txt}</span>`}
function q(o){return Object.entries(o).filter(([k,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
const hm=loc=>loc?loc.slice(11):'';  // device-local "YYYY-MM-DD HH:MM" -> HH:MM
// Error text incl. position and conflict list
function errText(e){
  const j=e.body&&e.body.error;if(!j)return e.message;
  let s=j.code==='off_grid'&&E?t('err.off_grid',{g:E.grid_min}):e.message;
  const at=[];if(j.pump)at.push(t('at.pump',{n:j.pump}));if(j.entry)at.push(t('at.entry',{n:j.entry}));if(j.rule)at.push(t('at.rule',{n:j.rule}));
  if(j.field)at.push(j.field);if(at.length)s+=' – '+at.join(', ');
  (j.conflicts||[]).forEach(c=>{s+='\n• '+t('cf.'+c.code,{p1:c.first.pump,t1:c.first.time,p2:c.second.pump,t2:c.second.time,
    nd:c.next_day?t('cf.next_day'):'',gap:c.gap_min||0})});
  return s;
}

// ---------------------------------------------------------------- status
function buildPumps(){
  S.pumps.forEach(p=>{const n=p.pump,d=document.createElement('section');d.className='card';
    d.innerHTML=`<h3><span ${L('pump')}></span> ${n}</h3><div id="c${n}" style="margin:6px 0"></div><table id="t${n}"></table>
    <div class="row"><div><label ${L('m.ml')}></label><input id="ml${n}" type="number" step="0.01" min="0" value="1"></div><button id="md${n}" ${L('btn.dose')}></button><button class="sec" id="ms${n}" ${L('btn.stop')}></button></div>
    <div class="row"><div><label ${L('b.ml')}></label><input id="bm${n}" type="number" step="0.1" min="0"></div><div><label ${L('b.days')}></label><input id="bd${n}" type="number" min="1" max="30" value="3"></div>
    <button class="sec" id="bs${n}" ${L('b.start')}></button><button class="x" id="bx${n}" ${L('b.stop')}></button></div><div class="msg" id="m${n}"></div>`;
    $('pumps').appendChild(d);i18n.apply(d);
    const err=e=>msg('m'+n,errText(e));
    $('md'+n).onclick=()=>{const ml=$('ml'+n).value;api('POST','/api/v1/pumps/dose?'+q({pump:n,ml})).then(j=>msg('m'+n,j.status==='queued'?t('m.queued'):t('m.ok',{ml}),true)).catch(e=>{
      const j=e.body&&e.body.error;if(j&&j.code==='collision_lock')msg('m'+n,j.retry_local?t('m.retry',{t:hm(j.retry_local)}):t('m.retry.busy'));else err(e)})};
    $('ms'+n).onclick=()=>api('POST','/api/v1/pumps/stop?pump='+n).catch(err);
    $('bs'+n).onclick=()=>api('POST','/api/v1/pumps/boost?'+q({pump:n,ml:$('bm'+n).value,days:$('bd'+n).value})).then(()=>msg('m'+n,t('b.ok'),true)).catch(err);
    $('bx'+n).onclick=()=>api('POST','/api/v1/pumps/boost?'+q({pump:n,action:'stop'})).then(()=>msg('m'+n,t('b.stopped'),true)).catch(err);
  });built=true;
}
function renderPump(p){
  const n=p.pump,rows=[];let c='';
  if(p.delayed)c+=chip(t('s.delayed')+': '+t('reason.'+p.delayed.reason),'warn');
  if(p.queued)c+=chip(t('s.queued'),'svc');
  if(p.boost&&p.boost.active)c+=chip(t('s.boost'),'ok');
  if(p.last_skip)c+=chip(t('s.skipped')+': '+p.skipped,'err');
  $('c'+n).innerHTML=c;
  rows.push(['s.next',p.next?`${esc(p.next.local.slice(5))} · ${f(p.next.ml,2)} ml`:t('s.none')]);
  if(p.delayed)rows.push(['s.delayed',`${t('reason.'+p.delayed.reason)} · `+(p.delayed.retry_local?t('s.retry',{t:hm(p.delayed.retry_local)}):t('s.retry.busy'))]);
  if(p.queued)rows.push(['s.queued',t('s.queued.v',{ml:f(p.queued.ml,2),t:hm(p.queued.since_local)})]);
  if(p.last_skip)rows.push(['s.skipped',t('s.skipped.v',{n:p.skipped,r:t('skip.'+p.last_skip.reason),t:esc(p.last_skip.local||'')})]);
  if(p.last_run)rows.push(['s.last_run',esc(p.last_run.local)]);
  rows.push(['s.today',`${f(p.planned_today_ml,2)} ml`]);
  if(p.remaining_days!==null)rows.push(['s.days',t('s.days.v',{d:f(p.remaining_days,1)})]);
  if(p.boost)rows.push(['s.boost',t('s.boost.v',{rem:f(p.boost.remaining_ml,2),tot:f(p.boost.total_ml,1),d:p.boost.days,s:p.boost.start})]);
  $('t'+n).innerHTML=rows.map(r=>`<tr><td class="k">${t(r[0])}</td><td>${r[1]}</td></tr>`).join('');
  $('bx'+n).disabled=!p.boost;
}
function render(){
  if(!S)return;if(!built)buildPumps();S.pumps.forEach(renderPump);
  $('clock').textContent=S.clock_valid?S.now_local:t('time.none');$('clock').className='chip '+(S.clock_valid?'':'err');
  if(ED)renderSlots();
}
async function poll(){try{S=await api('GET','/api/v1/schedule/status');render()}catch(e){$('clock').textContent=t('conn',{e:e.message});$('clock').className='chip err'}}

// ---------------------------------------------------------------- editor (raw JSON)
function renderEditor(){
  const {pump,grid_min,today,...plan}=ED;
  $('ed_json').value=JSON.stringify(plan,null,2);
  renderSlots();
}
function renderSlots(){
  const d=ED.today;
  $('ed_slots').textContent=!d?t('ed.today.unknown'):!d.slots.length?t('ed.today.none'):
    t('ed.today',{d:d.date,n:d.slots.length,ml:f(d.ml,2)})+': '+d.slots.map(s=>`${s.time} ${f(s.ml,2)}`).join(' · ');
}
async function loadEditor(){
  try{ED=await api('GET','/api/v1/pumps/schedule?pump='+$('ed_pump').value);renderEditor();$('ed_msg').textContent=''}catch(e){msg('ed_msg',errText(e))}
}

// ---------------------------------------------------------------- locks
function renderLocks(){
  $('lk_manual').value=LK.manual;
  const po=(cur)=>[1,2,3,4,5].map(n=>`<option ${n===cur?'selected':''}>${n}</option>`).join('');
  const box=$('lk_rules');
  box.innerHTML=LK.rules.map((r,i)=>`<div class="row" id="lr${i}"><div><label ${L('lk.a')}></label><select data-a>${po(r.pumps[0])}</select></div>
    <div><label ${L('lk.b')}></label><select data-b>${po(r.pumps[1])}</select></div>
    <div><label ${L('lk.gap')}></label><input type="number" min="1" max="1440" data-g value="${r.gap_min}"></div><button class="x" data-del="${i}">✕</button></div>`).join('');
  i18n.apply(box);
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{readLocks();LK.rules.splice(Number(b.dataset.del),1);renderLocks()});
  $('lk_add').disabled=LK.rules.length>=10;
}
function readLocks(){
  LK.manual=$('lk_manual').value;
  LK.rules.forEach((r,i)=>{const e=$('lr'+i);r.pumps=[Number(e.querySelector('[data-a]').value),Number(e.querySelector('[data-b]').value)];r.gap_min=Number(e.querySelector('[data-g]').value)});
}
async function loadLocks(){try{LK=await api('GET','/api/v1/schedule/locks');renderLocks()}catch(e){msg('lk_msg',errText(e))}}

// ---------------------------------------------------------------- engineering
async function loadEng(){try{E=await api('GET','/api/v1/engineering/scheduler');$('e_grid').value=E.grid_min;$('e_delay').value=E.max_delay_min}catch(e){msg('emsg',errText(e))}}

$('ed_pump').innerHTML=[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('');
$('ed_pump').onchange=loadEditor;
$('ed_reload').onclick=loadEditor;
$('ed_save').onclick=()=>{let body;try{body=JSON.parse($('ed_json').value)}catch(e){msg('ed_msg',t('ed.json',{e:e.message}));return}
  api('PUT','/api/v1/pumps/schedule?pump='+$('ed_pump').value,body).then(j=>{ED=j;renderEditor();msg('ed_msg',t('ed.ok'),true);poll()})
  .catch(e=>msg('ed_msg',errText(e)))};
$('lk_add').onclick=()=>{readLocks();LK.rules.push({pumps:[1,2],gap_min:5});renderLocks()};
$('lk_save').onclick=()=>{readLocks();api('PUT','/api/v1/schedule/locks',LK).then(j=>{LK=j;renderLocks();msg('lk_msg',t('lk.ok'),true)}).catch(e=>msg('lk_msg',errText(e)))};
$('e_save').onclick=()=>api('POST','/api/v1/engineering/scheduler?'+q({grid_min:$('e_grid').value,max_delay_min:$('e_delay').value}))
  .then(j=>{E=j;msg('emsg',t('eng.ok'),true)}).catch(e=>msg('emsg',errText(e)));
i18n.onChange(()=>{render();if(ED)renderSlots();if(LK){readLocks();renderLocks()}});
i18n.init('lang');
loadEng().then(loadEditor);loadLocks();poll();setInterval(poll,2000);
</script>
</body>
</html>
